<div class="fundo">
    <div class="container-promocoes">
        <div class="header-promocoes">
            <h2 class="titulo">Promoções</h2>
        </div>
        @for (nomeImagem of listaDePromocoes; track nomeImagem; let i = $index) {
            <div class="conteudo-promocoes">
                <img [src]="'./images/promocoes/' + nomeImagem" class="banner-image" [alt]="' '" (error)="esconderElementoPai($event, i)">
            </div>
        }
    </div>
</div>
